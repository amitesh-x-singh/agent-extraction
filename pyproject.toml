[project]
name = "site-extraction-one-agent"
version = "0.1.0"
description = "Single-agent supplier site-location research pipeline (no orchestration, per-tool call budgets, no geocoding)."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.17",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    # Imported directly (not merely transitively): langgraph in agent.py, openai in
    # search_tool.py's raw Responses API call, pydantic in schemas.py. Declared so a fresh
    # install cannot silently lose them to a dependency resolution that drops them.
    "langgraph>=1.0",
    "openai>=2.0",
    "pydantic>=2.0",
    "requests>=2.34",
    "python-dotenv>=1.0",
]

[project.scripts]
site-extraction-one-agent = "site_extraction_one_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
