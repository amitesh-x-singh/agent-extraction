[project]
name = "site-extraction-one-agent"
version = "0.1.0"
description = "Single-agent supplier site-location research pipeline (no orchestration, per-tool call budgets, no geocoding)."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.17",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    # Imported directly (not merely transitively): langgraph in agent.py, openai in
    # search_tool.py's raw Responses API call, pydantic in schemas.py. Declared so a fresh
    # install cannot silently lose them to a dependency resolution that drops them.
    "langgraph>=1.0",
    "openai>=2.0",
    "pydantic>=2.0",
    "requests>=2.34",
    # PDF text extraction in fetch_page's free tier. 194 of 412 paid fallbacks in
    # queries_log.jsonl were PDFs, 71 of them ISO/IATF/AS9100 certificates -- the densest
    # address source a company publishes (one measured 24-page ISO 14001 bundle carries ~20
    # exact plant addresses). All of the sampled ones return HTTP 200 application/pdf on a plain
    # GET and extract cleanly. pypdf, not pymupdf (AGPL-3.0) or pdfminer.six (pulls in
    # cryptography/cffi): BSD-3, pure Python, no transitive deps, no system binaries.
    "pypdf>=5.1",
    "python-dotenv>=1.0",
    "cryptography>=50.0.1",
    "pypdfium2>=5.13.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
site-extraction-one-agent = "site_extraction_one_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
